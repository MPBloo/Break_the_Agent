<!doctype html>
<html><head><meta charset="utf-8"><title>M1 · Break the Agent</title>
<style>
@font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #0E0F12; overflow: hidden; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// M1 · BREAK THE AGENT · 30 s opening title.
// Every frame is a pure function of t (seconds): render(t) draws it from scratch.
// Beat grid: 124 BPM. Scenes: A eye opens 0-2 · B inside the pupil 2-6 · C a world it has never seen 6-10
// · D constraints 10-15 · E the iris shatters 15-20 · F the title assembles 20-26 · G drop on the ember 26-30.
window.DURATION = 30;
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const BEAT = 60 / 124;
const C = { ch: '#0E0F12', bone: '#F2EEE6', ember: '#FF5A1F', red: '#C8261B', water: '#3BA3FF', smoke: '#6B6F78', black: '#000000' };
const cv = document.getElementById('c'), x = cv.getContext('2d');

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const eInExpo = (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10));
const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eOutCubic = (k) => 1 - Math.pow(1 - k, 3);
const eOutBack = (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const beat = (n) => n * BEAT;
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
function text(s, px, py, size, opts = {}) {
  x.save();
  x.font = `${opts.weight || 400} ${size}px ${opts.font || 'Anton'}`;
  x.fillStyle = opts.color || C.bone;
  x.globalAlpha *= opts.alpha == null ? 1 : opts.alpha;
  x.textAlign = opts.align || 'center';
  x.textBaseline = opts.baseline || 'middle';
  x.letterSpacing = (opts.spacing || 0) + 'px';
  x.fillText(s, px, py);
  x.restore();
}
// a decaying shake triggered at given times
function shake(t, hits, amp) {
  let dx = 0, dy = 0;
  for (const h of hits) { const d = t - h; if (d >= 0 && d < 0.35) { const k = Math.exp(-d * 14); dx += Math.sin(d * 90) * amp * k; dy += Math.cos(d * 77) * amp * k; } }
  return [dx, dy];
}
function flash(t, at, color, dur = 0.12, peak = 0.75) {
  const d = t - at; if (d < 0 || d > dur) return;
  x.save(); x.globalAlpha = peak * (1 - d / dur); x.fillStyle = color; x.fillRect(0, 0, W, H); x.restore();
}

// ---------------------------------------------------------------- precomputed, deterministic data
const R = rng(7);
const RINGS = [0, 1, 2, 3, 4, 5].map((i) => ({
  n: [72, 96, 120, 144, 160, 180][i], speed: (i % 2 ? -1 : 1) * (0.12 + R() * 0.35),
  lens: Array.from({ length: 180 }, () => 0.25 + R() * 0.75), accent: 5 + Math.floor(R() * 6),
}));
const NUMBERS = ['0.0269', '10.85', '204.0', '0.238', '-0.5', '3.38', '6.0', '120', '10', '5', '0.90', '0.85', '0.73', '0.31'];
const CODE = ['def fit(hyp, tests):', '  r = compare(hyp)', '  for k in keys:', '    step = solve(J, -r)', 'return least_squares(r)',
  'async function deploy() {', '  await build(app)', '}', 'SELECT * FROM agents', 'git commit -m "ship it"', 'export default App',
  'const ui = render(<Dashboard/>)', 'test("passes", () => ok)', 'kubectl apply -f prod.yaml', 'fn main() -> Result<()>'];
const MATH = ['∫ f(x) dx', 'Σ 1/n²  =  π²/6', '∂L/∂θ', 'e^{iπ} + 1 = 0', '∀ε > 0  ∃δ > 0', 'lim n→∞', 'P ⇒ Q', '∇·E = ρ/ε₀', 'det(A) ≠ 0', '□'];
const EMBERS = Array.from({ length: 140 }, () => ({ x: R(), ph: R(), sp: 0.08 + R() * 0.22, sz: 1.5 + R() * 3.5, sw: R() * 6.28, fl: 2 + R() * 6 }));
const TREES = [0, 1, 2].map((layer) => Array.from({ length: 34 - layer * 8 }, (_, i) => ({ x: (i + R() * 0.8) / (34 - layer * 8), h: 0.25 + R() * 0.35 + layer * 0.1, w: 0.02 + R() * 0.02 })));
const CRACKS = Array.from({ length: 11 }, (_, i) => {
  const a0 = (i / 11) * Math.PI * 2 + R() * 0.3; const pts = [[Math.cos(a0) * 120, Math.sin(a0) * 120]];
  let a = a0, r = 120; while (r < 700) { r += 40 + R() * 70; a += (R() - 0.5) * 0.35; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return pts;
});
const LETTERS = 'BREAKTHEAGENT'.split('');
const SHARDS = [];
for (let ring = 0; ring < 3; ring++) for (let s = 0; s < 8; s++) {
  const a0 = (s / 8) * Math.PI * 2 + ring * 0.2, a1 = ((s + 1) / 8) * Math.PI * 2 + ring * 0.2;
  const r0 = 130 + ring * 150, r1 = r0 + 150, am = (a0 + a1) / 2, rm = (r0 + r1) / 2;
  SHARDS.push({ a0, a1, r0, r1, cx: Math.cos(am) * rm, cy: Math.sin(am) * rm, vx: Math.cos(am) * (170 + R() * 330) + (R() - 0.5) * 120,
    vy: Math.sin(am) * (110 + R() * 230) + (R() - 0.5) * 90, rot: (R() - 0.5) * 2.4, letter: LETTERS[(ring * 8 + s) % LETTERS.length], target: (ring * 8 + s) % LETTERS.length });
}
const SPLASH = Array.from({ length: 16 }, () => ({ a: -Math.PI * (0.1 + R() * 0.8), v: 260 + R() * 420, s: 3 + R() * 5 }));
const STEAM = Array.from({ length: 10 }, () => ({ dx: (R() - 0.5) * 80, v: 40 + R() * 70, s: 18 + R() * 30, d: R() * 0.25 }));
// film grain: one noise tile, offset per frame (deterministic)
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), im = g.createImageData(256, 256), r = rng(99); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }

// ---------------------------------------------------------------- building blocks
function iris(t, rp, rOuter, opts = {}) {
  const alpha = opts.alpha == null ? 1 : opts.alpha;
  x.save(); x.globalAlpha *= alpha; x.lineCap = 'round';
  RINGS.forEach((ring, i) => {
    const r0 = lerp(rp + 12, rOuter, i / RINGS.length), r1 = lerp(rp + 12, rOuter, (i + 0.85) / RINGS.length);
    const rot = t * ring.speed;
    for (let k = 0; k < ring.n; k++) {
      const a = rot + (k / ring.n) * Math.PI * 2, len = ring.lens[k % ring.lens.length];
      x.strokeStyle = k % ring.accent === 0 ? (opts.accent || C.ember) : C.smoke;
      x.lineWidth = k % ring.accent === 0 ? 3 : 1.6;
      x.beginPath(); x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); x.lineTo(Math.cos(a) * lerp(r0, r1, len), Math.sin(a) * lerp(r0, r1, len)); x.stroke();
    }
  });
  // data around the iris
  x.font = '400 15px JBM'; x.fillStyle = C.smoke; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let k = 0; k < 28; k++) {
    const a = -t * 0.06 + (k / 28) * Math.PI * 2;
    x.save(); x.translate(Math.cos(a) * (rOuter + 30), Math.sin(a) * (rOuter + 30)); x.rotate(a + Math.PI / 2);
    x.fillText(NUMBERS[k % NUMBERS.length], 0, 0); x.restore();
  }
  x.restore();
}
function pupil(rp, opts = {}) {
  x.save();
  x.fillStyle = C.black; x.beginPath(); x.arc(0, 0, rp, 0, Math.PI * 2); x.fill();
  x.strokeStyle = C.bone; x.globalAlpha = 0.35; x.lineWidth = 2; x.stroke();
  if (opts.highlight !== false) { x.globalAlpha = 0.85; x.fillStyle = C.bone; x.beginPath(); x.ellipse(-rp * 0.38, -rp * 0.42, rp * 0.12, rp * 0.08, -0.6, 0, Math.PI * 2); x.fill(); }
  x.restore();
}
function eyeShape(w, h) { x.beginPath(); x.moveTo(-w, 0); x.quadraticCurveTo(0, -h * 2, w, 0); x.quadraticCurveTo(0, h * 2, -w, 0); x.closePath(); }
function eye(t, open, rp, scale, opts = {}) {
  x.save(); x.translate(CX, CY); x.scale(scale, scale);
  const w = 760, h = 300 * open;
  x.save(); eyeShape(w, h); x.clip();
  x.fillStyle = '#121419'; x.fillRect(-w, -h * 2, w * 2, h * 4);
  iris(t, rp, 340, opts);
  if (opts.inside) { x.save(); x.beginPath(); x.arc(0, 0, rp, 0, Math.PI * 2); x.clip(); opts.inside(); x.restore(); x.strokeStyle = C.bone; x.globalAlpha = 0.4; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, rp, 0, Math.PI * 2); x.stroke(); x.globalAlpha = 1; }
  else pupil(rp);
  x.restore();
  x.strokeStyle = C.bone; x.lineWidth = 2.5 / scale; x.globalAlpha = 0.9; eyeShape(w, Math.max(h, 0.5)); x.stroke();
  x.restore();
}
function forest(t, w, h, glow) {
  // night sky with a burning horizon
  const g = x.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#07080a'); g.addColorStop(0.55, '#1a0c08'); g.addColorStop(1, '#5a1a0a');
  x.fillStyle = g; x.fillRect(-w / 2, -h / 2, w, h);
  const rg = x.createRadialGradient(0, h * 0.45, 10, 0, h * 0.45, w * 0.7);
  rg.addColorStop(0, `rgba(255,90,31,${0.55 * glow})`); rg.addColorStop(1, 'rgba(255,90,31,0)');
  x.fillStyle = rg; x.fillRect(-w / 2, -h / 2, w, h);
  TREES.forEach((layer, li) => {
    x.fillStyle = ['#1b0b07', '#0d0605', '#030303'][li];
    const base = h / 2 - li * h * 0.02;
    layer.forEach((tr) => {
      const px = -w / 2 + tr.x * w + Math.sin(t * 0.7 + tr.x * 9) * 1.5;
      x.beginPath(); x.moveTo(px - tr.w * w, base); x.lineTo(px, base - tr.h * h * 0.7); x.lineTo(px + tr.w * w, base); x.fill();
    });
  });
  embers(t, w, h, 1, 0);
}
function embers(t, w, h, alpha, wind) {
  x.save();
  EMBERS.forEach((e) => {
    const life = (t * e.sp + e.ph) % 1;
    const px = -w / 2 + e.x * w + Math.sin(t * 1.3 + e.sw) * 18 + life * (40 + wind);
    const py = h / 2 - life * h * 1.05;
    const a = alpha * (1 - life) * (0.55 + 0.45 * Math.sin(t * e.fl + e.sw));
    x.globalAlpha = Math.max(0, a); x.fillStyle = life < 0.5 ? C.ember : '#ffb36b';
    x.beginPath(); x.arc(px, py, e.sz * (1 - life * 0.5), 0, Math.PI * 2); x.fill();
  });
  x.restore();
}
function stamp(label, px, py, size, rot, k, color) {
  // k: 0 -> 1 slam progress
  if (k <= 0) return;
  const s = lerp(1.9, 1, eOutExpo(clamp(k * 1.6))), a = clamp(k * 4);
  x.save(); x.translate(px, py); x.rotate(rot); x.scale(s, s); x.globalAlpha = a;
  x.font = `400 ${size}px Anton`; x.letterSpacing = '4px';
  const m = x.measureText(label), bw = m.width + size * 0.7, bh = size * 1.25;
  x.strokeStyle = color; x.lineWidth = size * 0.07; x.strokeRect(-bw / 2, -bh / 2, bw, bh);
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, 0, size * 0.04);
  x.restore();
}

// ---------------------------------------------------------------- scenes
function sceneA(t) {             // 0-2 s: the eye snaps open on the first downbeat
  x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
  const lid = seg(t, 0.15, beat(1));
  const open = t < beat(1) ? 0 : eOutBack(seg(t, beat(1), beat(1) + 0.38));
  const scale = 1 + 0.07 * eInOut(seg(t, beat(1), 2.0));
  if (open <= 0) {               // closed lid: a thin line of light
    x.save(); x.globalAlpha = lid; x.strokeStyle = C.bone; x.lineWidth = 2;
    x.beginPath(); x.moveTo(CX - 760 * lid, CY); x.lineTo(CX + 760 * lid, CY); x.stroke(); x.restore();
    return;
  }
  eye(t, open, 120, scale);
  flash(t, beat(1), C.bone, 0.1, 0.35);
}
function sceneB(t) {             // 2-6 s: dive into the pupil; what agents can already do
  const p = eInExpo(seg(t, 2.0, beat(5)));
  if (t < beat(5)) {
    x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
    eye(t, 1, 120, 1.07 + p * 16);
    return;
  }
  x.fillStyle = C.black; x.fillRect(0, 0, W, H);
  const words = [[beat(5), beat(7), 'WRITES CODE', 'code'], [beat(7), beat(9), 'PROVES THEOREMS', 'math'], [beat(9), beat(11), 'BUILDS APPS', 'ui']];
  for (const [a, b, word, kind] of words) {
    if (t < a || t >= b) continue;
    const k = t - a;
    if (kind === 'code') {
      x.save(); x.font = '400 24px JBM'; x.textAlign = 'left';
      for (let col = 0; col < 4; col++) for (let row = 0; row < 26; row++) {
        const y = ((row * 46 - k * (220 + col * 60)) % (26 * 46) + 26 * 46) % (26 * 46) - 40;
        const line = CODE[(row * 3 + col * 5) % CODE.length];
        x.globalAlpha = 0.18 + 0.12 * ((row + col) % 3); x.fillStyle = (row * 7 + col) % 11 === 0 ? C.ember : C.smoke;
        x.fillText(line, 60 + col * 470, y);
      }
      x.restore();
    } else if (kind === 'math') {
      x.save(); x.textAlign = 'center';
      MATH.forEach((m, i) => {
        const r2 = rng(i + 3); const px = 150 + r2() * 1620, py = 120 + r2() * 840, sz = 40 + r2() * 70;
        x.globalAlpha = 0.16 + 0.2 * r2(); x.fillStyle = i % 4 === 0 ? C.ember : C.smoke;
        x.font = `400 ${sz}px JBM`; x.fillText(m, px + (k * (r2() - 0.5) * 120), py - k * 30 * r2());
      });
      x.restore();
    } else {
      x.save(); x.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        const col = i % 4, row = Math.floor(i / 4), bx = 180 + col * 400, by = 150 + row * 270, bw = 360, bh = 230;
        const d = clamp((k - i * 0.04) / 0.35);
        x.strokeStyle = i === 5 ? C.ember : C.smoke; x.globalAlpha = 0.5;
        const per = 2 * (bw + bh) * eOutCubic(d);
        x.setLineDash([per, 9999]); x.strokeRect(bx, by, bw, bh); x.setLineDash([]);
        if (d >= 1) { x.fillStyle = i === 5 ? C.ember : C.smoke; x.globalAlpha = 0.35;
          for (let j = 0; j < 4; j++) x.fillRect(bx + 24, by + 40 + j * 44, (bw - 48) * clamp((k - i * 0.04 - 0.35) * 3 - j * 0.3), 14); }
      }
      x.restore();
    }
    const pop = 1 + 0.22 * (1 - eOutExpo(clamp(k / 0.18)));
    const punch = 1 + 0.035 * Math.max(0, 1 - (t - (a + BEAT)) / 0.15) * (t > a + BEAT ? 1 : 0);
    x.save(); x.translate(CX, CY); x.scale(pop * punch, pop * punch);
    text(word, 0, 0, 200, { spacing: 6 });
    x.restore();
    flash(t, a, C.bone, 0.09, 0.55);
  }
  if (t >= beat(11)) {            // pull back out of the pupil: it closes into a circle
    const k = eOutExpo(seg(t, beat(11), 6.0));
    sceneC(t, lerp(1300, 300, k), k);
  }
}
function sceneC(t, rpOverride, enter) {   // 6-10 s: a world it has never seen, reflected in the pupil
  x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
  const rp = rpOverride != null ? rpOverride : lerp(300, 235, eInOut(seg(t, 6.0, 7.2)));
  const cam = 1.0 + 0.06 * seg(t, 6.0, 10.0);
  x.save(); x.translate(CX, CY - 40); x.scale(cam, cam);
  if (rp < 900) {
    const w = 1200, h = 470;
    x.save(); eyeShape(w, h); x.clip(); x.fillStyle = '#121419'; x.fillRect(-w, -h * 2, w * 2, h * 4); iris(t, rp, rp + 300, { alpha: enter == null ? 1 : enter }); x.restore();
    x.strokeStyle = C.bone; x.globalAlpha = enter == null ? 0.9 : enter * 0.9; x.lineWidth = 2.5; eyeShape(w, h); x.stroke(); x.globalAlpha = 1;
  }
  x.save(); x.beginPath(); x.arc(0, 0, rp, 0, Math.PI * 2); x.clip();
  forest(t, rp * 2.4, rp * 2.2, 0.8 + 0.2 * Math.sin(t * 3));
  x.restore();
  x.strokeStyle = C.bone; x.globalAlpha = 0.45; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, rp, 0, Math.PI * 2); x.stroke(); x.globalAlpha = 1;
  x.restore();
  if (rpOverride == null) {
    const y = 960, parts = [['NOW,', beat(14), C.bone], ['A WORLD', beat(15), C.bone], ['IT HAS NEVER SEEN', beat(16), C.ember]];
    x.font = '400 92px Anton'; x.letterSpacing = '2px';
    const gap = 34, widths = parts.map((p) => x.measureText(p[0]).width), total = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
    x.letterSpacing = '0px';
    let px = CX - total / 2;
    parts.forEach(([word, at, col], i) => { text(word, px, y, 92, { alpha: seg(t, at, at + 0.12), align: 'left', color: col, spacing: 2 }); px += widths[i] + gap; });
  }
}
function sceneD(t) {             // 10-15 s: ten tries, one shot, no feedback
  x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
  x.save(); x.translate(CX, CY); embers(t, W, H, 0.35, 120); x.restore();
  const start = beat(21), half = BEAT / 2;
  const hits = [start]; for (let i = 1; i < 10; i++) hits.push(start + i * half);
  const oneShot = start + 10 * half, noFeedback = oneShot + 2 * BEAT;
  const [sx, sy] = shake(t, [start, oneShot, noFeedback], 9);
  x.save(); x.translate(sx, sy);
  if (t >= start && t < oneShot) {
    const i = Math.min(9, Math.floor((t - start) / half)), k = (t - start - i * half) / half;
    const n = 10 - i;
    const sc = 1 + 0.18 * (1 - eOutExpo(clamp(k * 3)));
    x.save(); x.translate(CX, CY - 40); x.scale(sc, sc);
    text(String(n), 0, 0, 420, { font: 'JBM', weight: 700, color: n === 1 ? C.ember : C.bone });
    x.restore();
    text('TEST DROPS LEFT', CX, CY + 230, 34, { font: 'JBM', color: C.smoke, spacing: 8 });
  }
  if (t >= oneShot) {
    text('10 TRIES', CX, 250, 70, { font: 'JBM', weight: 700, color: C.smoke, spacing: 10, alpha: seg(t, oneShot, oneShot + 0.2) });
    stamp('ONE SHOT', CX, CY - 10, 170, -0.06, seg(t, oneShot, oneShot + 0.35), C.ember);
    stamp('NO FEEDBACK', CX, CY + 250, 120, 0.05, seg(t, noFeedback, noFeedback + 0.35), C.bone);
  }
  x.restore();
  flash(t, start, C.bone, 0.08, 0.4); flash(t, oneShot, C.ember, 0.1, 0.45); flash(t, noFeedback, C.bone, 0.1, 0.35);
}
function shardPath(s, grow) {
  x.beginPath();
  x.arc(0, 0, s.r1 * grow, s.a0, s.a1); x.arc(0, 0, s.r0 * grow, s.a1, s.a0, true); x.closePath();
}
function sceneE(t) {             // 15-20 s: the iris cracks and shatters into typographic shards
  const crackStart = beat(31), shatter = beat(32);
  const cutIndex = Math.floor((t - shatter) / BEAT);
  const palettes = [[C.ch, C.ember, C.ch], [C.ember, C.ch, C.bone], [C.ch, C.bone, C.ch], [C.red, C.ch, C.ember]];
  const pal = t < shatter ? palettes[0] : palettes[((cutIndex % 4) + 4) % 4];
  x.fillStyle = pal[0]; x.fillRect(0, 0, W, H);
  if (t < shatter) {
    eye(t, 1, 120, 1.25);
    const k = eOutCubic(seg(t, crackStart, shatter));
    x.save(); x.translate(CX, CY); x.scale(1.25, 1.25); x.strokeStyle = C.bone; x.lineWidth = 2.5; x.lineJoin = 'round';
    CRACKS.forEach((pts) => { const n = Math.max(1, Math.floor(pts.length * k)); x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n; i++) x.lineTo(pts[i][0], pts[i][1]); x.stroke(); });
    x.restore();
    return;
  }
  const d = t - shatter;
  const fly = eOutCubic(clamp(d / 1.6));
  const [sx, sy] = shake(t, [shatter], 14);
  x.save(); x.translate(CX + sx, CY + sy);
  SHARDS.forEach((s, i) => {
    const px = s.vx * fly + s.vx * 0.12 * d, py = s.vy * fly + s.vy * 0.12 * d, rot = s.rot * fly + s.rot * 0.15 * d;
    x.save(); x.translate(px, py); x.rotate(rot);
    shardPath(s, 1.0); x.fillStyle = pal[1]; x.fill();
    x.save(); shardPath(s, 1.0); x.clip();
    x.font = '400 360px Anton'; x.fillStyle = pal[2]; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(s.letter, s.cx, s.cy); x.restore();
    x.restore();
  });
  x.restore();
  // a question between the shards
  const qa = seg(t, beat(36), beat(36) + 0.15);
  if (qa > 0) {
    x.save(); x.globalAlpha = qa; x.font = '400 120px Anton'; x.letterSpacing = '4px'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineJoin = 'round'; x.lineWidth = 22; x.strokeStyle = pal[0]; x.strokeText('WHERE DOES IT BREAK?', CX, CY);
    x.fillStyle = pal[0] === C.bone ? C.ch : C.bone; x.fillText('WHERE DOES IT BREAK?', CX, CY); x.restore();
  }
  flash(t, shatter, C.bone, 0.14, 0.8);
}
function titleLayout() {
  x.font = '400 300px Anton'; x.letterSpacing = '8px';
  const l1 = 'BREAK THE', l2 = 'AGENT';
  const w1 = x.measureText(l1).width, w2 = x.measureText(l2).width;
  const pos = []; let cx = -w1 / 2;
  for (const ch of l1) { const cw = x.measureText(ch).width + 8; if (ch !== ' ') pos.push({ ch, x: cx + cw / 2, y: -150, line: 1 }); cx += cw; }
  cx = -w2 / 2;
  for (const ch of l2) { const cw = x.measureText(ch).width + 8; pos.push({ ch, x: cx + cw / 2, y: 160, line: 2 }); cx += cw; }
  x.letterSpacing = '0px';
  return { pos, w2 };
}
function sceneF(t, settle, behind) {     // 20-26 s: the shards fly back and become the title
  x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
  const start = 20.0;
  const { pos, w2 } = titleLayout();
  const s = settle || { scale: 1, dy: 0 };
  // faint iris echo behind the title
  x.save(); x.translate(CX, CY + s.dy); iris(t, 300, 560, { alpha: 0.12 * s.scale }); x.restore();
  if (behind) behind();
  x.save(); x.translate(CX, CY + s.dy); x.scale(s.scale * (1 + 0.025 * seg(t, 21.5, 26)), s.scale * (1 + 0.025 * seg(t, 21.5, 26)));
  SHARDS.forEach((sh, i) => {            // shards converge on their letter, shrinking
    const target = pos[sh.target], ti = start + 0.05 * i;
    const k = eInOut(seg(t, ti, ti + 1.1));
    if (k >= 1) return;
    const fromX = sh.vx * 1.6, fromY = sh.vy * 1.6;
    const px = lerp(fromX, target.x, k), py = lerp(fromY, target.y, k);
    x.save(); x.translate(px, py); x.rotate(sh.rot * (1 - k)); x.scale(1 - k * 0.9, 1 - k * 0.9);
    shardPath(sh, 0.5); x.fillStyle = C.ember; x.globalAlpha = 1 - k * 0.5; x.fill(); x.restore();
  });
  pos.forEach((p, i) => {
    const arrive = start + 0.9 + i * 0.075, k = seg(t, arrive, arrive + 0.35);
    if (k <= 0) return;
    const sc = lerp(1.6, 1, eOutBack(k));
    x.save(); x.translate(p.x, p.y); x.scale(sc, sc);
    x.font = '400 300px Anton'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.globalAlpha = clamp(k * 3); x.fillStyle = p.line === 2 ? C.ember : C.bone; x.fillText(p.ch, 0, 0);
    x.restore();
    if (t - arrive < 0.25 && t >= arrive) { x.save(); x.strokeStyle = C.bone; x.globalAlpha = 1 - (t - arrive) / 0.25; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, 40 + (t - arrive) * 500, 0, Math.PI * 2); x.stroke(); x.restore(); }
  });
  // underline under AGENT, then a light sweep across the title
  const ul = eOutExpo(seg(t, 22.3, 22.9));
  if (ul > 0) { x.fillStyle = C.ember; x.fillRect(-w2 / 2, 330, w2 * ul, 14); }
  const sw = seg(t, 23.2, 24.0);
  if (sw > 0 && sw < 1) {
    x.save(); x.globalCompositeOperation = 'source-atop';
    const gx = lerp(-1100, 1100, sw), g = x.createLinearGradient(gx - 160, 0, gx + 160, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(-1100, -400, 2200, 800); x.restore();
  }
  x.restore();
  flash(t, start, C.ember, 0.12, 0.5);
}
function sceneG(t) {             // 26-30 s: the title settles, a drop of water puts out an ember
  const k = eInOut(seg(t, 26.0, 26.9));
  const ex = CX, ey = 840, hit = 28.3, dropStart = 27.55;
  sceneF(t, { scale: lerp(1, 0.5, k), dy: lerp(0, -170, k) }, () => {
    if (t >= dropStart && t < hit) {  // the falling drop, accelerating, behind the title
      const f = (t - dropStart) / (hit - dropStart), dy = lerp(-60, ey - 22, f * f);
      x.save(); x.translate(ex, dy); x.fillStyle = C.water;
      x.beginPath(); x.moveTo(0, -30); x.bezierCurveTo(14, -8, 16, 4, 0, 14); x.bezierCurveTo(-16, 4, -14, -8, 0, -30); x.fill();
      x.restore();
    }
  });
  const la = seg(t, 26.7, 27.3);
  text('Junction 2026  ·  AfterQuery challenge', CX, 640, 40, { font: 'Inter', weight: 600, alpha: la, spacing: 3, color: C.bone });
  const ea = seg(t, 26.9, 27.4), out = seg(t, hit, hit + 0.5);
  if (ea > 0) {                   // the ember
    const flick = 0.85 + 0.15 * Math.sin(t * 23) * Math.sin(t * 7.3);
    const glow = (1 - out) * ea * flick;
    const g = x.createRadialGradient(ex, ey, 2, ex, ey, 90);
    g.addColorStop(0, `rgba(255,90,31,${0.75 * glow})`); g.addColorStop(1, 'rgba(255,90,31,0)');
    x.fillStyle = g; x.fillRect(ex - 100, ey - 100, 200, 200);
    x.fillStyle = out < 1 ? C.ember : '#2a2b30'; x.globalAlpha = ea; x.beginPath(); x.ellipse(ex, ey, 16, 10, 0, 0, Math.PI * 2); x.fill();
    if (out > 0) { x.globalAlpha = ea * out; x.fillStyle = '#2a2b30'; x.beginPath(); x.ellipse(ex, ey, 16, 10, 0, 0, Math.PI * 2); x.fill(); }
    x.globalAlpha = 1;
  }
  if (t >= hit) {
    const d = t - hit;
    SPLASH.forEach((s) => {           // droplets
      const px = ex + Math.cos(s.a) * s.v * d, py = ey - 8 + Math.sin(s.a) * s.v * d + 900 * d * d;
      const a = clamp(1 - d / 0.6); if (a <= 0) return;
      x.globalAlpha = a; x.fillStyle = C.water; x.beginPath(); x.arc(px, py, s.s * (1 - d), 0, Math.PI * 2); x.fill();
    });
    STEAM.forEach((s) => {            // a puff of steam
      const dd = d - s.d; if (dd <= 0) return;
      const a = clamp(0.5 * (1 - dd / 1.1)); if (a <= 0) return;
      x.globalAlpha = a; x.fillStyle = C.smoke; x.beginPath(); x.arc(ex + s.dx * dd * 2, ey - 10 - s.v * dd, s.s * (0.6 + dd), 0, Math.PI * 2); x.fill();
    });
    x.globalAlpha = 1;
    flash(t, hit, C.water, 0.1, 0.18);
  }
}

// ---------------------------------------------------------------- render
window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  if (t < 2.0) sceneA(t);
  else if (t < 6.0) sceneB(t);
  else if (t < beat(21)) sceneC(t);
  else if (t < beat(31)) sceneD(t);
  else if (t < 20.0) sceneE(t);
  else if (t < 26.0) sceneF(t);
  else sceneG(t);
  // vignette and film grain on every frame
  const v = x.createRadialGradient(CX, CY, 420, CX, CY, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  const f = Math.floor(t * 60);
  x.save(); x.globalAlpha = 0.045; x.globalCompositeOperation = 'overlay';
  const ox = -((f * 73) % 256), oy = -((f * 151) % 256);
  for (let gx = ox; gx < W; gx += 256) for (let gy = oy; gy < H; gy += 256) x.drawImage(grain, gx, gy);
  x.restore();
};
window.ready = Promise.all(['400 100px Anton', '400 20px Inter', '600 20px Inter', '400 20px JBM', '700 20px JBM'].map((f) => document.fonts.load(f)));
window.ready.then(() => window.render(0));
</script>
