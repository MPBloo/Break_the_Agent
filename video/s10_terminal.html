<!doctype html>
<html><head><meta charset="utf-8"><title>Scene 10 · One command</title>
<style>
@font-face { font-family: JBM; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #0E0F12; overflow: hidden; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Scene 10 · ONE COMMAND · 60 s. A terminal replays the real output of `python run_eval.py`, captured with the
// time at which each line was printed (the run takes 45 s), then the camera moves in on the results table.
window.DURATION = 60;
const OUT = [[0.0, "[1/5] Playing 11 scripted agents on seeds 1..10 ..."], [17.22, "[2/5] MCP parity: reference on seed 1 scores 0.9371 over MCP, 0.9371 in-process -> identical"], [27.1, "[3/5] Frontier-model transcripts: 72 found in results/llm/, 72 reproduce their stored score on replay."], [27.1, "[4/5] Attributing lost points ..."], [45.38, "[5/5] Wrote results/summary.md, results/summary.json, results/report.html (4476 KB)."], [45.39, ""], [45.39, "Agent                               kind         n    mean    std    min    max"], [45.39, "Reference solution                  reference   10   0.859  0.058  0.724  0.937"], [45.39, "Claude Opus 5.5                     frontier     9   0.853  0.062  0.745  0.942"], [45.39, "Claude Sonnet 5.5                   frontier     9   0.730  0.075  0.616  0.842"], [45.39, "Claude Sonnet 4.5                   frontier     9   0.315  0.194  0.000  0.604"], [45.39, "Claude Haiku 5.5                    frontier     9   0.000  0.000  0.000  0.000"], [45.4, "Stops fitting early                 heuristic   10   0.599  0.308  0.000  0.887"], [45.4, "One flight condition                heuristic   10   0.745  0.087  0.631  0.899"], [45.4, "Assumes uniform wind                heuristic   10   0.385  0.147  0.128  0.604"], [45.4, "Ignores the smoke column            heuristic   10   0.192  0.111  0.000  0.396"], [45.4, "Trusts priors                       heuristic   10   0.039  0.068  0.000  0.215"], [45.4, "Stop early                          baseline    10   0.042  0.022  0.000  0.076"], [45.41, "Calibrate, never drop               baseline    10   0.000  0.000  0.000  0.000"], [45.41, "Release overhead                    baseline    10   0.000  0.000  0.000  0.000"], [45.41, "Random actions                      baseline    10   0.000  0.000  0.000  0.000"], [45.41, "Do nothing                          baseline    10   0.000  0.000  0.000  0.000"], [45.41, "claude-haiku-5-5                    legacy       9   0.270  0.389  0.000  0.942"], [45.41, "claude-opus-5-5-weather-2026-11-15  legacy       9   0.839  0.064  0.750  0.974"], [45.42, "claude-sonnet-5-5                   legacy       9   0.708  0.072  0.618  0.859"], [45.42, "haiku-high-nouvel-essai             legacy       9   0.000  0.000  0.000  0.000"], [45.42, ""], [45.42, "Done in 45 s."]];
const W = 1920, H = 1080, C = { ch: '#0E0F12', term: '#121418', bar: '#1b1e23', ink: '#E6E8EB', dim: '#7c838d', green: '#4fbf6a', blue: '#3BA3FF', ember: '#FF5A1F' };
const cv = document.getElementById('c'), x = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (k) => k * k * k * (k * (k * 6 - 15) + 10);
const lerp = (a, b, k) => a + (b - a) * k;
const CMD = 'python run_eval.py', TYPE0 = 1.6, CPS = 0.07, ENTER = 3.2, OUT0 = 3.5;
const WX = 300, WY = 60, WW = 1320, WH = 960, LH = 30, FS = 21, TX = WX + 40, TY = WY + 100;
const END = OUT0 + OUT[OUT.length - 1][0];
const row = (s) => OUT.findIndex((o) => o[1].startsWith(s));
function lineY(i) { return TY + (i + 1) * LH; }           // line 0 is the command
function band(i0, i1, a, color = C.blue) {
  if (a <= 0) return;
  x.save(); x.globalAlpha = a * 0.16; x.fillStyle = color; x.fillRect(TX - 14, lineY(i0) - LH + 7, WW - 52, (i1 - i0 + 1) * LH); x.restore();
  x.save(); x.globalAlpha = a; x.fillStyle = color; x.fillRect(TX - 14, lineY(i0) - LH + 7, 3, (i1 - i0 + 1) * LH); x.restore();
}
window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.fillStyle = C.ch; x.fillRect(0, 0, W, H);
  // camera: hold, then move in on the results table once the run is over
  const ri = row('Reference solution'), zk = ease(seg(t, END + 1.5, END + 4.5));
  const z = lerp(1, 1.42, zk), fy = lerp(H / 2, lineY(ri + 2), zk), fx = lerp(W / 2, TX + 420, zk);
  const appear = ease(seg(t, 0, 0.9));
  x.globalAlpha = appear * (1 - seg(t, 59, 60));
  x.translate(W / 2, H / 2 + (1 - appear) * 30); x.scale(z, z); x.translate(-fx, -fy);
  // window
  x.fillStyle = C.term; x.beginPath(); x.roundRect(WX, WY, WW, WH, 16); x.fill();
  x.strokeStyle = '#2a2d33'; x.lineWidth = 1.5; x.stroke();
  x.fillStyle = C.bar; x.beginPath(); x.roundRect(WX, WY, WW, 48, [16, 16, 0, 0]); x.fill();
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(WX + 30 + i * 24, WY + 24, 7, 0, 7); x.fill(); });
  x.font = '400 17px Inter'; x.fillStyle = C.dim; x.textAlign = 'center'; x.fillText('Break_the_Agent — bash', WX + WW / 2, WY + 30); x.textAlign = 'left';
  // highlights
  const r3 = row('[3/5]');
  band(r3, r3, seg(t, OUT0 + OUT[r3][0] + 0.5, OUT0 + OUT[r3][0] + 1.0) * (1 - seg(t, OUT0 + OUT[r3][0] + 7, OUT0 + OUT[r3][0] + 7.5)), C.green);
  const r2 = row('[2/5]');
  band(r2, r2, seg(t, OUT0 + OUT[r2][0] + 4.0, OUT0 + OUT[r2][0] + 4.5) * (1 - seg(t, OUT0 + OUT[r3][0] - 0.2, OUT0 + OUT[r3][0] + 0.3)), C.green);
  band(ri, ri + 3, seg(t, END + 4.5, END + 5.2));
  // text
  x.font = `400 ${FS}px JBM`;
  const prompt = (y) => { x.fillStyle = C.green; x.fillText('~/Break_the_Agent', TX, y); x.fillStyle = C.ink; x.fillText(' $ ', TX + x.measureText('~/Break_the_Agent').width, y); return TX + x.measureText('~/Break_the_Agent $ ').width; };
  const px = prompt(lineY(-1));
  const typed = CMD.slice(0, Math.max(0, Math.floor((t - TYPE0) / CPS)));
  x.fillStyle = C.ink; x.fillText(typed, px, lineY(-1));
  let shown = 0;
  OUT.forEach(([dt, s], i) => {
    if (t < OUT0 + dt) return;
    shown = i + 1;
    x.fillStyle = s.startsWith('[') ? C.ink : (s.startsWith('Agent ') ? C.dim : C.ink);
    if (s.startsWith('Done')) x.fillStyle = C.green;
    x.fillText(s, TX, lineY(i));
  });
  // block cursor: after the command while typing, then on the line below the output while the run works
  const blink = Math.floor(t * 2) % 2 === 0;
  let cx, cy;
  if (t < ENTER) { cx = px + x.measureText(typed).width; cy = lineY(-1); }
  else if (t < END + 0.2) { cx = TX; cy = lineY(shown); }
  else { cx = prompt(lineY(OUT.length)); cy = lineY(OUT.length); }
  if (blink || (t > TYPE0 && t < ENTER)) { x.fillStyle = C.ink; x.globalAlpha *= 0.85; x.fillRect(cx, cy - FS + 3, 12, FS + 4); }
};
window.ready = Promise.all(['400 20px JBM', '700 20px JBM', '400 17px Inter'].map((f) => document.fonts.load(f)));
window.ready.then(() => window.render(0));
</script>
</body></html>
